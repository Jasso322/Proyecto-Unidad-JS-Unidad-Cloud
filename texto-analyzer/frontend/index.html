<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analizador de Texto Distribuido</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f; --surface: #13131f; --border: #2a2a3f;
      --accent: #7c6dfa; --accent2: #fa6d9a; --text: #e8e8f0; --muted: #6b6b8a;
      --pending: #f0a040; --processing: #40a0f0; --done: #40d090; --error: #f05060;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% 20%, rgba(124,109,250,0.08) 0%, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 80%, rgba(250,109,154,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
    header { margin-bottom: 2.5rem; border-left: 3px solid var(--accent); padding-left: 1rem; }
    header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header p { font-family: 'Space Mono', monospace; color: var(--muted); font-size: 0.78rem; margin-top: 0.4rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.8rem; margin-bottom: 2rem; transition: border-color 0.3s; }
    .card:focus-within { border-color: var(--accent); }
    .card label { display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .card input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.88rem; padding: 0.6rem 0.9rem; margin-bottom: 1rem; outline: none; transition: border-color 0.2s; }
    .card input[type="text"]:focus { border-color: var(--accent); }
    .card textarea { width: 100%; height: 130px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Space Mono', monospace; font-size: 0.85rem; padding: 0.8rem; resize: vertical; outline: none; transition: border-color 0.2s; }
    .card textarea:focus { border-color: var(--accent); }
    .char-count { text-align: right; font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); margin-top: 0.3rem; }
    .btn-row { display: flex; gap: 0.8rem; margin-top: 1.2rem; flex-wrap: wrap; }
    button { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.04em; cursor: pointer; border: none; border-radius: 8px; padding: 0.65rem 1.4rem; transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s; }
    button:active { transform: scale(0.97); }
    #btn-enviar { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    #btn-enviar:hover { box-shadow: 0 0 20px rgba(124,109,250,0.4); }
    #btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; }
    #btn-limpiar { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    #btn-limpiar:hover { border-color: var(--muted); color: var(--text); }
    .ejemplos-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
    .btn-ejemplo { font-family: 'Space Mono', monospace; font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 0.3rem 0.8rem; }
    .btn-ejemplo:hover { border-color: var(--accent); color: var(--accent); }
    #lista-tareas { display: flex; flex-direction: column; gap: 1rem; }
    .tarea-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; animation: slideIn 0.35s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .tarea-header { display: flex; align-items: center; gap: 0.8rem; padding: 1rem 1.2rem; cursor: pointer; user-select: none; }
    .tarea-header:hover { background: rgba(255,255,255,0.02); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; transition: background 0.4s; }
    .dot-pendiente { background: var(--pending); }
    .dot-en_proceso { background: var(--processing); animation: pulse 1s infinite; }
    .dot-completada { background: var(--done); }
    .dot-error { background: var(--error); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
    .tarea-nombre { flex: 1; font-weight: 700; font-size: 0.92rem; }
    .tarea-status-label { font-family: 'Space Mono', monospace; font-size: 0.72rem; padding: 0.2rem 0.6rem; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .label-pendiente { background: rgba(240,160,64,0.15); color: var(--pending); }
    .label-en_proceso { background: rgba(64,160,240,0.15); color: var(--processing); }
    .label-completada { background: rgba(64,208,144,0.15); color: var(--done); }
    .label-error { background: rgba(240,80,96,0.15); color: var(--error); }
    .tarea-worker { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--muted); }
    .tarea-body { display: none; padding: 0 1.2rem 1.2rem; border-top: 1px solid var(--border); }
    .tarea-body.open { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 0 0 0; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease, background 0.4s; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; margin-top: 0.8rem; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; text-align: center; }
    .stat-value { font-family: 'Space Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.2rem; }
    .freq-list { margin-top: 0.8rem; }
    .freq-item { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
    .freq-palabra { font-family: 'Space Mono', monospace; font-size: 0.8rem; min-width: 100px; }
    .freq-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .freq-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; }
    .freq-count { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--muted); min-width: 20px; text-align: right; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
    .tag { font-family: 'Space Mono', monospace; font-size: 0.7rem; background: rgba(124,109,250,0.12); border: 1px solid rgba(124,109,250,0.3); color: var(--accent); border-radius: 4px; padding: 0.2rem 0.5rem; }
    .resumen-box { margin-top: 0.8rem; background: var(--bg); border-left: 2px solid var(--accent2); border-radius: 0 6px 6px 0; padding: 0.7rem 0.9rem; font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 0.4rem; }
    canvas { width: 100%; height: 80px; border-radius: 6px; display: block; margin-top: 0.6rem; }
    .empty-state { text-align: center; padding: 3rem; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.82rem; border: 1px dashed var(--border); border-radius: 12px; }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
    #toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 0.8rem 1.2rem; font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--accent); transform: translateY(100px); opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 100; }
    #toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>⬡ Analizador de Texto</h1>
    <p>Procesamiento distribuido · Workers Docker · Redis Queue · SSE</p>
  </header>
  <div class="card">
    <p class="section-title">Ejemplos rápidos</p>
    <div class="ejemplos-bar" id="ejemplos-bar"></div>
    <label for="input-nombre">Nombre de la tarea</label>
    <input type="text" id="input-nombre" placeholder="ej. Análisis de artículo" maxlength="60"/>
    <label for="input-texto">Texto a analizar</label>
    <textarea id="input-texto" placeholder="Escribe o pega aquí el texto que quieres analizar..."></textarea>
    <div class="char-count"><span id="char-count">0</span> caracteres</div>
    <div class="btn-row">
      <button id="btn-enviar">▶ Enviar tarea</button>
      <button id="btn-limpiar">✕ Limpiar</button>
    </div>
  </div>
  <p class="section-title">Tareas enviadas</p>
  <div id="lista-tareas">
    <div class="empty-state">
      <div class="icon">◈</div>
      Aún no hay tareas. Envía un texto para comenzar.
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const API = '';
const inputNombre = document.getElementById('input-nombre');
const inputTexto  = document.getElementById('input-texto');
const btnEnviar   = document.getElementById('btn-enviar');
const btnLimpiar  = document.getElementById('btn-limpiar');
const listaTareas = document.getElementById('lista-tareas');
const charCount   = document.getElementById('char-count');
const toast       = document.getElementById('toast');
const ejemplosBar = document.getElementById('ejemplos-bar');
const tareasRenderizadas = new Set();

function mostrarToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

inputTexto.addEventListener('input', () => { charCount.textContent = inputTexto.value.length; });
btnLimpiar.addEventListener('click', () => { inputTexto.value = ''; inputNombre.value = ''; charCount.textContent = '0'; });
inputNombre.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputTexto.focus(); });

function cargarEjemplos() {
  const guardados = JSON.parse(localStorage.getItem('ejemplos') || '[]');
  ejemplosBar.innerHTML = '';
  const predefinidos = [
    { nombre: 'Demo ES', texto: 'La inteligencia artificial transforma la industria tecnológica. Los algoritmos de aprendizaje automático procesan grandes volúmenes de datos. Las empresas invierten en infraestructura cloud para escalar sus sistemas.' },
    { nombre: 'Demo EN', texto: 'Distributed systems allow multiple workers to process tasks in parallel. Message queues decouple producers from consumers, improving scalability and reliability of cloud applications.' },
  ];
  [...predefinidos, ...guardados.slice(-3)].forEach((ej) => {
    const btn = document.createElement('button');
    btn.className = 'btn-ejemplo';
    btn.textContent = ej.nombre;
    btn.addEventListener('click', () => { inputTexto.value = ej.texto; inputNombre.value = ej.nombre; charCount.textContent = ej.texto.length; });
    ejemplosBar.appendChild(btn);
  });
}

function guardarEjemplo(nombre, texto) {
  const guardados = JSON.parse(localStorage.getItem('ejemplos') || '[]');
  if (!guardados.find(e => e.texto === texto)) {
    guardados.push({ nombre, texto });
    localStorage.setItem('ejemplos', JSON.stringify(guardados.slice(-5)));
  }
  cargarEjemplos();
}

cargarEjemplos();

async function enviarTarea() {
  const texto  = inputTexto.value.trim();
  const nombre = inputNombre.value.trim() || 'Tarea sin nombre';
  if (!texto) { mostrarToast('⚠ Escribe un texto primero'); return; }
  btnEnviar.disabled = true;
  btnEnviar.textContent = '⏳ Enviando...';
  try {
    const res = await fetch(`${API}/tarea`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto, nombre }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { tarea_id } = await res.json();
    guardarEjemplo(nombre, texto);
    renderizarTarea({ id: tarea_id, nombre, texto, status: 'pendiente' });
    escucharSSE(tarea_id);
    mostrarToast(`✓ Tarea enviada: ${nombre}`);
    inputTexto.value = ''; inputNombre.value = ''; charCount.textContent = '0';
  } catch (err) {
    mostrarToast(`✗ Error: ${err.message}`);
  } finally {
    btnEnviar.disabled = false;
    btnEnviar.textContent = '▶ Enviar tarea';
  }
}

btnEnviar.addEventListener('click', enviarTarea);

function escucharSSE(tareaId) {
  const es = new EventSource(`${API}/estado/${tareaId}`);
  es.onmessage = (event) => {
    const datos = JSON.parse(event.data);
    actualizarTarjeta(tareaId, datos);
    if (datos.status === 'completada' || datos.status === 'error') es.close();
  };
  es.onerror = () => es.close();
}

function renderizarTarea(tarea) {
  const emptyState = listaTareas.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
  if (tareasRenderizadas.has(tarea.id)) return;
  tareasRenderizadas.add(tarea.id);
  const card = document.createElement('div');
  card.className = 'tarea-card';
  card.id = `tarea-${tarea.id}`;
  card.innerHTML = buildCardHTML(tarea);
  listaTareas.insertBefore(card, listaTareas.firstChild);
  card.querySelector('.tarea-header').addEventListener('click', () => {
    card.querySelector('.tarea-body').classList.toggle('open');
  });
}

function buildCardHTML(tarea) {
  const progressMap = { pendiente: '5', en_proceso: '55', completada: '100', error: '100' };
  const progressBg  = tarea.status === 'error' ? 'var(--error)' : tarea.status === 'completada' ? 'var(--done)' : tarea.status === 'en_proceso' ? 'var(--processing)' : 'var(--pending)';
  return `
    <div class="tarea-header">
      <div class="status-dot dot-${tarea.status}"></div>
      <span class="tarea-nombre">${escapeHtml(tarea.nombre)}</span>
      <span class="tarea-status-label label-${tarea.status}">${tarea.status.replace('_',' ')}</span>
      ${tarea.worker ? `<span class="tarea-worker">${tarea.worker}</span>` : ''}
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${progressMap[tarea.status]||5}%;background:${progressBg}"></div>
    </div>
    <div class="tarea-body">
      <div id="resultado-${tarea.id}">
        ${tarea.status === 'pendiente' ? '<p style="color:var(--muted);font-size:0.8rem;padding-top:0.8rem">⏳ En cola, esperando worker...</p>' : ''}
      </div>
    </div>`;
}

function actualizarTarjeta(tareaId, datos) {
  const card = document.getElementById(`tarea-${tareaId}`);
  if (!card) { renderizarTarea(datos); return; }
  const progressMap = { pendiente: '5', en_proceso: '55', completada: '100', error: '100' };
  const progressBg  = datos.status === 'error' ? 'var(--error)' : datos.status === 'completada' ? 'var(--done)' : datos.status === 'en_proceso' ? 'var(--processing)' : 'var(--pending)';
  card.querySelector('.status-dot').className = `status-dot dot-${datos.status}`;
  card.querySelector('.tarea-status-label').className = `tarea-status-label label-${datos.status}`;
  card.querySelector('.tarea-status-label').textContent = datos.status.replace('_',' ');
  card.querySelector('.progress-fill').style.width = `${progressMap[datos.status]||5}%`;
  card.querySelector('.progress-fill').style.background = progressBg;
  const wLabel = card.querySelector('.tarea-worker');
  if (datos.worker && wLabel) wLabel.textContent = datos.worker;
  if (datos.status === 'completada' && datos.resultado) {
    document.getElementById(`resultado-${tareaId}`).innerHTML = buildResultadoHTML(datos.resultado);
    card.querySelector('.tarea-body').classList.add('open');
    if (datos.resultado.top_palabras?.length > 0)
      setTimeout(() => dibujarCanvas(`canvas-${tareaId}`, datos.resultado.top_palabras), 50);
  }
  if (datos.status === 'error') {
    document.getElementById(`resultado-${tareaId}`).innerHTML = `<p style="color:var(--error);padding-top:0.5rem;font-family:monospace;font-size:0.8rem">✗ ${datos.resultado?.error||'Error'}</p>`;
    card.querySelector('.tarea-body').classList.add('open');
  }
}

function buildResultadoHTML(r) {
  const top = r.top_palabras || [];
  const maxF = top.length > 0 ? top[0].frecuencia : 1;
  return `
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-value">${r.total_palabras}</div><div class="stat-label">Palabras</div></div>
      <div class="stat-box"><div class="stat-value">${r.total_caracteres}</div><div class="stat-label">Caracteres</div></div>
      <div class="stat-box"><div class="stat-value">${r.total_oraciones}</div><div class="stat-label">Oraciones</div></div>
      <div class="stat-box"><div class="stat-value">${r.idioma_detectado||'?'}</div><div class="stat-label">Idioma</div></div>
    </div>
    ${top.length > 0 ? `
    <p class="section-title">Palabras más frecuentes</p>
    <div class="freq-list">
      ${top.map(p=>`<div class="freq-item"><span class="freq-palabra">${escapeHtml(p.palabra)}</span><div class="freq-bar-bg"><div class="freq-bar-fill" style="width:${Math.round(p.frecuencia/maxF*100)}%"></div></div><span class="freq-count">${p.frecuencia}</span></div>`).join('')}
    </div>
    <p class="section-title">Visualización (Canvas)</p>
    <canvas id="canvas-${r.worker_id}"></canvas>` : ''}
    ${r.palabras_clave?.length > 0 ? `
    <p class="section-title">Palabras clave</p>
    <div class="tags">${r.palabras_clave.map(p=>`<span class="tag">#${escapeHtml(p)}</span>`).join('')}</div>` : ''}
    <p class="section-title">Primera oración</p>
    <div class="resumen-box">${escapeHtml(r.resumen)}</div>
    <p style="font-family:monospace;font-size:0.7rem;color:var(--muted);margin-top:0.6rem">Worker: <strong style="color:var(--accent)">${escapeHtml(r.worker_id)}</strong></p>`;
}

function dibujarCanvas(canvasId, palabras) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 400; const H = 80;
  canvas.width = W; canvas.height = H;
  const maxF = Math.max(...palabras.map(p=>p.frecuencia));
  const barW = Math.floor(W / palabras.length) - 4;
  palabras.forEach((p, i) => {
    const barH = Math.round((p.frecuencia/maxF)*(H-22));
    const x = i*(barW+4)+2; const y = H-barH-16;
    const grad = ctx.createLinearGradient(x,y,x,y+barH);
    grad.addColorStop(0,'#7c6dfa'); grad.addColorStop(1,'#fa6d9a');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(x,y,barW,barH,3); ctx.fill();
    ctx.fillStyle='#6b6b8a'; ctx.font=`${Math.min(10,barW-2)}px monospace`;
    ctx.textAlign='center'; ctx.fillText(p.palabra.substring(0,6), x+barW/2, H-2);
  });
}

async function cargarTareasPrevias() {
  try {
    const res = await fetch(`${API}/tareas`);
    if (!res.ok) return;
    const tareas = await res.json();
    tareas.reverse().forEach(t => {
      renderizarTarea(t);
      if (t.status === 'completada' && t.resultado) setTimeout(() => actualizarTarjeta(t.id, t), 50);
    });
  } catch(e) { console.warn('Backend no disponible'); }
}

cargarTareasPrevias();

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
